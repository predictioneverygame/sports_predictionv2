<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運彩系統</title>

<style>
body {
    font-family: Arial;
    background:#0f172a;
    color:white;
    padding:16px;
    margin:0;
}

h2 { text-align:center; }

.card {
    background:#1e293b;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
}

input, select {
    width:100%;
    padding:10px;
    margin:6px 0;
    font-size:16px;
    border-radius:8px;
    border:none;
}

button {
    width:100%;
    padding:12px;
    margin-top:10px;
    font-size:16px;
    background:#38bdf8;
    border:none;
    border-radius:10px;
    font-weight:bold;
}

button:active {
    transform: scale(0.98);
}

table {
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

td, th {
    border:1px solid #334155;
    padding:6px;
    text-align:center;
    font-size:13px;
}

.delBtn {
    background:#ef4444;
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:6px;
}

.card-title {
    font-size:16px;
    font-weight:700;
    margin-bottom:8px;
}

.hint {
    color:#94a3b8;
    font-size:13px;
    margin-top:6px;
}

.action-row {
    display:flex;
    gap:8px;
    margin-top:10px;
}

.action-row button {
    margin-top:0;
}

.smallBtn {
    background:#475569;
}

.resultSelect {
    width: auto;
    min-width: 72px;
    padding: 4px 6px;
    margin: 0;
    font-size: 12px;
    border-radius: 6px;
    background: #0f172a;
    color: #fff;
}

.resultSelect.hit { border: 1px solid #22c55e; }
.resultSelect.miss { border: 1px solid #ef4444; }

.result-cells {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
}

.result-cells label {
    font-size: 11px;
    color: #94a3b8;
}

.sport-switch {
    display:flex;
    gap:8px;
    margin-bottom:8px;
}

.sport-switch button {
    margin-top:0;
    background:#334155;
}

.sport-switch button.active {
    background:#0ea5e9;
}

.wc-group-switch {
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:8px 0 12px;
}

.wc-group-switch button {
    width:auto;
    flex:1 1 calc(16.66% - 6px);
    min-width:44px;
    margin-top:0;
    padding:8px 4px;
    font-size:13px;
    background:#334155;
}

.wc-group-switch button.active {
    background:#059669;
}

.wc-fixtures-list {
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:12px;
}

.wc-fixture-card {
    background:#0f172a;
    border:1px solid #334155;
    border-radius:10px;
    padding:12px;
}

.wc-fixture-head {
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    padding-bottom:8px;
    border-bottom:1px solid #334155;
}

.wc-fixture-round {
    font-size:12px;
    font-weight:700;
    color:#059669;
    background:rgba(5,150,105,.15);
    padding:2px 8px;
    border-radius:6px;
}

.wc-fixture-match {
    font-size:15px;
    font-weight:700;
    flex:1;
}

.wc-fixture-time {
    font-size:12px;
    color:#94a3b8;
}

.wc-fixture-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.wc-fixture-grid input {
    margin:0;
    font-size:14px;
    padding:8px;
}

.wc-fixture-submit {
    margin-top:10px;
    background:#059669;
    font-size:14px;
    padding:10px;
}

.field-label {
    color:#94a3b8;
    font-size:13px;
    font-weight:700;
    margin:10px 0 4px;
}

input[type="text"] {
    width:100%;
    padding:10px;
    margin:6px 0;
    font-size:16px;
    border-radius:8px;
    border:none;
}

#total {
    text-align:center;
    margin-top:15px;
    font-size:18px;
}
</style>

</head>

<body>

<h2>運彩記帳系統 V5</h2>

<div class="card">

<div class="sport-switch">
  <button id="sportBasketballBtn" type="button" onclick="setSportFilter('basketball')">籃球</button>
  <button id="sportSoccerBtn" type="button" onclick="setSportFilter('soccer')">足球</button>
</div>

<!-- 聯賽 -->
<select id="league" onchange="updateTeams()"></select>

<!-- 主隊 -->
<select id="home"></select>

<!-- 客隊 -->
<select id="away"></select>

<!-- 盤口方向 -->
<select id="lineSide">
  <option value="home">主隊</option>
  <option value="away">客隊</option>
</select>

<!-- 盤口 -->
<select id="line"></select>

<input id="odds" type="number" step="0.01" placeholder="賠率">
<input id="stake" type="number" placeholder="投注金額" value="8100">

<label style="display:flex;align-items:center;gap:8px;margin:8px 0;">
  <input id="enableSecondBet" type="checkbox" onchange="toggleSecondBetFields()">
  啟用第二組盤口（可選）
</label>

<div id="secondBetFields" style="display:none;">
  <select id="lineSide2">
    <option value="home">主隊</option>
    <option value="away">客隊</option>
  </select>
  <select id="line2"></select>
  <input id="odds2" type="number" step="0.01" placeholder="第二組賠率">
  <input id="stake2" type="number" placeholder="第二組投注金額" value="8100">
</div>
<input id="matchDateTime" type="datetime-local">

<input id="homeScore" type="number" placeholder="主隊比分">
<input id="awayScore" type="number" placeholder="客隊比分">

<button onclick="addRecommendation()">匯入到推薦網站</button>

</div>

<div class="card">
<div class="card-title">世足專區預測</div>
<div class="hint">選組別後顯示該組 6 場小組賽（時間為台灣 UTC+8），填寫波膽與初盤後個別匯入</div>

<div class="wc-group-switch" id="wcGroupSwitch"></div>
<div class="wc-fixtures-list" id="wcFixturesList"></div>
</div>

<div class="card">
<div class="card-title">已匯入推薦清單（雲端）</div>
<div class="action-row">
    <button class="smallBtn" onclick="loadCloudRecommendations()">重新整理清單</button>
</div>
<div class="hint" id="cloudStatus">尚未讀取</div>
<table>
    <thead>
        <tr>
            <th>日期</th>
            <th>聯賽</th>
            <th>比賽</th>
            <th>盤口</th>
            <th>初盤</th>
            <th>波膽</th>
            <th>刪除</th>
        </tr>
    </thead>
    <tbody id="cloudList"></tbody>
</table>
</div>

<div class="card">
<div class="card-title">已結算清單（雲端）</div>
<div class="action-row">
    <button class="smallBtn" onclick="loadCloudSettledMatches()">重新整理結算清單</button>
</div>
<div class="hint" id="settledStatus">尚未讀取</div>
<table>

function calc(line, odds, stake, home, away) {
    const lineSide = document.getElementById("lineSide").value;
    const result = getPredictionResultByLine(line, home, away, lineSide);
    if (result === "hit") return stake * odds - stake;
    if (result === "half_hit") return (stake * odds - stake) / 2;
    if (result === "miss") return -stake;
    if (result === "push") return 0;
    return 0;
}

function parseDateTimeInput(dateTimeRaw) {
    if (!dateTimeRaw) return null;
    const parts = dateTimeRaw.split("T");
    if (parts.length !== 2) return null;
    const date = parts[0];
    const time = parts[1].slice(0, 5);
    if (!date || !time) return null;
    return { date, time };
}

function buildMatchId(league, date, time, home, away) {
    const raw = `${league}_${date}_${time}_${home}_${away}`.toLowerCase();
    return raw
        .replaceAll(" ", "_")
        .replaceAll(":", "")
        .replaceAll("/", "_")
        .replaceAll(".", "_");
}

function getPredictionResultByLine(line, homeScore, awayScore, lineSide) {
    let normalizedLine = String(line || "").trim().replace(/^O/i, "大").replace("大3.0", "大3");
    if (normalizedLine === "全場大球") {
        normalizedLine = "大3";
    }
    const total = homeScore + awayScore;
    if (normalizedLine === "大2.75") {
        if (total >= 4) return "hit";
        if (total === 3) return "half_hit";
        return "miss";
    }
    if (normalizedLine === "大3.25") {
        if (total >= 4) return "hit";
        if (total === 3) return "half_miss";
        return "miss";
    }
    if (normalizedLine === "大3.75") {
        if (total >= 5) return "hit";
        if (total === 4) return "half_hit";
        return "miss";
    }
    if (normalizedLine === "大3" || normalizedLine === "大3.0") {
        if (total > 3) return "hit";
        if (total === 3) return "push";
        return "miss";
    }

    const halfOver = normalizedLine.match(/^大(\d+)\.5$/);
    if (halfOver) {
        const thr = parseFloat(halfOver[1] + ".5");
        return total > thr ? "hit" : "miss";
    }

    if (normalizedLine === "PK") {
        if (lineSide === "away") {
            if (awayScore > homeScore) return "hit";
            if (awayScore < homeScore) return "miss";
            return "push";
        }
        if (homeScore > awayScore) return "hit";
        if (homeScore < awayScore) return "miss";
        return "push";
    }

    const spread = parseFloat(normalizedLine);
    if (!isNaN(spread)) {
        const adjusted = lineSide === "away"
            ? awayScore + spread - homeScore
            : homeScore + spread - awayScore;
        if (adjusted > 0) return "hit";
        if (adjusted < 0) return "miss";
        return "push";
    }

    return "pending";
}

function getProfitByResult(result, stake, odds) {
    const s = toNum(stake) || 0;
    const o = toNum(odds) || 0;
    if (result === "hit") return s * o - s;
    if (result === "half_hit") return (s * o - s) / 2;
    if (result === "miss") return -s;
    if (result === "half_miss") return -(s / 2);
    if (result === "push") return 0;
    return 0;
}

function parseStoredLine(rawLine, sport) {
    const text = String(rawLine || "").trim().replace("大3.0", "大3");
    if (sport !== "basketball") {
        return { lineSide: "home", lineValue: text };
    }
    if (text.startsWith("主隊 ")) {
        return { lineSide: "home", lineValue: text.replace("主隊 ", "").trim() };
    }
    if (text.startsWith("客隊 ")) {
        return { lineSide: "away", lineValue: text.replace("客隊 ", "").trim() };
    }
    return { lineSide: "home", lineValue: text };
}

function formatLineText(line, lineSide, sport) {
    const normalizedLine = String(line || "").trim().replace("大3.0", "大3");
    if (sport === "basketball") {
        return `${lineSide === "home" ? "主隊" : "客隊"} ${normalizedLine}`;
    }
    return normalizedLine;
}

function containsQuestionMark(v) {
    return String(v || "").includes("?");

const PRED_RESULTS_LINE_SUFFIX = /[|｜]__r:[os=hmpx?,]+$/i;

function resultCodeToValue(code) {
    const c = String(code || "").toLowerCase();
    if (c === "h") return "hit";
    if (c === "m" || c === "x") return "miss";
    if (c === "p") return "push";
    return null;
}

function valueToResultCode(value) {
    if (value === "hit") return "h";
    if (value === "miss") return "m";
    if (value === "push") return "p";
    return "";
}

function parsePredictionResultsFromLine(text) {
    const raw = String(text || "");
    const results = { opening: null, scores: null };
    let display = raw;
    const suffix = raw.match(PRED_RESULTS_LINE_SUFFIX);
    if (suffix) {
        display = raw.replace(PRED_RESULTS_LINE_SUFFIX, "").trim();
        const body = String(suffix[0]).replace(/^.*__r:/i, "");
        body.split(",").forEach((part) => {
            const kv = part.match(/^([os])=([hmxp?])$/i);
            if (!kv) return;
            const val = resultCodeToValue(kv[2]);
            if (kv[1].toLowerCase() === "o") results.opening = val;
            if (kv[1].toLowerCase() === "s") results.scores = val;
        });
    }
    return { display, results };
}

const MATCH_MANUAL_RESULTS_KEY = "rs_match_manual_results";

function loadMatchManualResultsStore() {
    try {
        return JSON.parse(localStorage.getItem(MATCH_MANUAL_RESULTS_KEY) || "{}");
    } catch (err) {

function saveMatchManualResultsStore(store) {

}

function getStoredMatchManualResults(id) {
    const store = loadMatchManualResultsStore();
    return store[String(id)] || { opening: null, scores: null };
}

function setStoredMatchManualResults(id, opening, scores) {
    const store = loadMatchManualResultsStore();
    const current = store[String(id)] || { opening: null, scores: null };
    const next = {
        opening: opening !== undefined ? opening : current.opening,
        scores: scores !== undefined ? scores : current.scores
    };
    if (!next.opening && !next.scores) {
        delete store[String(id)];
    } else {
        store[String(id)] = next;
    }
    saveMatchManualResultsStore(store);
}

function encodeLineWithResults(baseLine, openingResult, scoresResult) {
    const base = parsePredictionResultsFromLine(baseLine).display;
    const parts = [];
    if (openingResult) parts.push(`o=${valueToResultCode(openingResult)}`);
    if (scoresResult) parts.push(`s=${valueToResultCode(scoresResult)}`);
    if (!parts.length) return base;
    return `${base}｜__r:${parts.join(",")}`;
}

function isCombinedOpeningScoreText(text) {
    const display = parsePredictionResultsFromLine(text).display;
    return /初盤\s*:/.test(display) && /波膽\s*:/.test(display);
}

function resultSelectHtml(table, id, field, current) {
    const options = [
        ["", "自動"],
        ["hit", "✓ 過"],
        ["miss", "✗ 不過"]
    ];
    const cls = current === "hit" ? " hit" : (current === "miss" ? " miss" : "");
    const opts = options.map(([value, label]) =>
        `<option value="${value}"${current === value ? " selected" : ""}>${label}</option>`
    ).join("");
    return `<select class="resultSelect${cls}" onchange="updatePredictionResult('${table}','${encodeURIComponent(id)}','${field}',this.value)">${opts}</select>`;
}

function openingScoreResultCells(table, id, item, isMatchRow) {
    const raw = isMatchRow ? (item.prediction_value || "") : (item.line || "");
    const lineMeta = parsePredictionResultsFromLine(raw);
    let results = { ...lineMeta.results };
    if (isMatchRow) {
        const stored = getStoredMatchManualResults(id);
        if (stored.opening) results.opening = stored.opening;
        if (stored.scores) results.scores = stored.scores;
    }
    const hasCombined = isCombinedOpeningScoreText(raw) || results.opening || results.scores;
    if (!hasCombined) {
        return "<td>—</td><td>—</td>";
    }
    return (
        `<td><div class="result-cells"><label>初盤</label>${resultSelectHtml(table, id, "opening", results.opening || "")}</div></td>` +
        `<td><div class="result-cells"><label>波膽</label>${resultSelectHtml(table, id, "scores", results.scores || "")}</div></td>`
    );
}

async function updatePredictionResult(table, encodedId, field, value) {
    const id = decodeURIComponent(encodedId);
    const resultValue = value || null;

    if (table === "recommendations") {
        const item = cloudRecommendations.find((x) => String(x.id) === String(id));
        if (!item) return;
        const parsed = parsePredictionResultsFromLine(item.line);
        const next = { ...parsed.results };
        next[field] = resultValue;
        const nextLine = encodeLineWithResults(parsed.display, next.opening, next.scores);
        try {
            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${encodeURIComponent(id)}`,
                {
                    method: "PATCH",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({ line: nextLine })
                }
            );
            if (!response.ok) {
                const msg = await response.text();
                throw new Error(msg || "更新失敗");
            }
            item.line = nextLine;
            renderCloudRecommendations();
            setCloudStatus("已更新初盤/波膽結果");
        } catch (err) {
            console.error(err);
            alert("更新失敗，請確認 recommendations 的 update 權限");
        }
        return;
    }

    if (table === "matches") {
        const item = cloudSettledMatches.find((x) => String(x.id) === String(id));
        if (!item) return;
        const parsed = parsePredictionResultsFromLine(item.prediction_value || "");
        const next = { ...parsed.results, ...getStoredMatchManualResults(id) };
        next[field] = resultValue;
        const nextValue = encodeLineWithResults(parsed.display, next.opening, next.scores);
        const nextRow = { ...item, prediction_value: nextValue };
        delete nextRow.created_at;

        try {
            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/${SUPABASE_MATCHES_TABLE}?on_conflict=id`,
                {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "resolution=merge-duplicates,return=minimal"
                    },
                    body: JSON.stringify([nextRow])
                }
            );
            if (response.ok) {
                item.prediction_value = nextValue;
                setStoredMatchManualResults(id, null, null);
                renderCloudSettledMatches();
                setSettledStatus("已更新初盤/波膽結果");
                return;
            }
        } catch (err) {
            console.error(err);
        }

        setStoredMatchManualResults(id, next.opening, next.scores);
        renderCloudSettledMatches();
        setSettledStatus("已存本機（雲端無更新權限，首頁同瀏覽器可見）");
        return;
    }
}

function fixGarbledRecommendations(list) {
    const sameTimeCounter = {};
    return (list || []).map((item) => {
        const key = `${item.date} ${item.time}`;
        sameTimeCounter[key] = (sameTimeCounter[key] || 0) + 1;
        const keyedFix = GARBLED_FIX_BY_DATE_TIME[`${key}#${sameTimeCounter[key]}`] || GARBLED_FIX_BY_DATE_TIME[key];
        if (!keyedFix) return item;
        const shouldFix =
            containsQuestionMark(item.league) ||
            containsQuestionMark(item.home) ||
            containsQuestionMark(item.away) ||
            containsQuestionMark(item.line);
        if (!shouldFix) return item;
        return {
            ...item,
            league: keyedFix.league,
            home: keyedFix.home,
            away: keyedFix.away,
            line: keyedFix.line,
            sport: keyedFix.sport
        };
    });
}

function renderCloudRecommendations() {
    const cloudList = document.getElementById("cloudList");
    cloudList.innerHTML = "";

    if (!cloudRecommendations.length) {
        cloudList.innerHTML = `
        <tr>
            <td colspan="7">目前沒有雲端資料</td>
        </tr>`;
        return;
    }

    const grouped = {};
    cloudRecommendations.forEach((item) => {
        const key = getMatchGroupKey(item);
        if (!grouped[key]) {
            grouped[key] = {
                first: item,
                items: [],
                lines: []
            };
        }
        grouped[key].items.push(item);
        grouped[key].lines.push(String(item.line || "").replace("大3.0", "大3"));
    });

    Object.values(grouped).forEach((group) => {
        const item = group.first;
        var mergedLines = Array.from(new Set(group.lines)).join("/");
        const rawLine = /^世足\s*[A-L]組/.test(String(item.league || ""))
            ? (item.summary ? `初盤:${mergedLines}｜${item.summary}` : mergedLines)
            : mergedLines;
        const displayLine = parsePredictionResultsFromLine(
            isCombinedOpeningScoreText(item.line || "") ? item.line : rawLine
        ).display;
        cloudList.innerHTML += `
        <tr>
            <td>${item.date} ${item.time}</td>
            <td>${item.league}</td>
            <td>${item.home} vs ${item.away}</td>
            <td>${displayLine}</td>
            ${openingScoreResultCells("recommendations", item.id, item, false)}
            <td>
              <div class="action-row">
                <button class="smallBtn" onclick="settleCloudRecommendation('${item.id}')">結算</button>
                <button class="delBtn" onclick="deleteCloudRecommendationGroup('${item.id}')">刪除</button>
              </div>
            </td>
        </tr>`;
    });
}

async function settleCloudRecommendation(id) {
    const item = cloudRecommendations.find((x) => String(x.id) === String(id));
    if (!item) {
        alert("找不到要結算的推薦資料");
        return;
    }

    const homeScoreRaw = prompt(`請輸入主隊 ${item.home} 比分`, "0");
    if (homeScoreRaw === null) return;
    const awayScoreRaw = prompt(`請輸入客隊 ${item.away} 比分`, "0");
    if (awayScoreRaw === null) return;

    const homeScore = toNum(homeScoreRaw);
    const awayScore = toNum(awayScoreRaw);
    if (homeScore === null || awayScore === null) {
        alert("賽果格式錯誤，請輸入數字");
        return;
    }

    const groupKey = getMatchGroupKey(item);
    const sameMatchItems = cloudRecommendations.filter((x) => getMatchGroupKey(x) === groupKey);
    if (!sameMatchItems.length) {
        alert("找不到同場推薦資料");
        return;
    }

    const settledRows = sameMatchItems.map((entry) => {
        const parsedLine = parseStoredLine(entry.line, entry.sport);
        const result = getPredictionResultByLine(parsedLine.lineValue, homeScore, awayScore, parsedLine.lineSide);
        const profit = getProfitByResult(result, entry.stake, entry.odds);
        return {
            line: String(entry.line || ""),
            result,
            profit,
            stake: toNum(entry.stake) || 0
        };
    });

    const totalProfit = settledRows.reduce((sum, row) => sum + row.profit, 0);
    const totalStake = settledRows.reduce((sum, row) => sum + row.stake, 0);
    const mergedLineText = settledRows.map((row) => row.line).join(" / ");
    const mergedResult = totalProfit > 0 ? "hit" : (totalProfit < 0 ? "miss" : "push");
    const lineMeta = parsePredictionResultsFromLine(item.line || mergedLineText);

    const row = {
        id: buildMatchId(item.league, item.date, item.time, item.home, item.away),
        date: item.date,
        time: item.time,
        league: item.league,
        sport: item.sport,
        status: "final",
        home_name: item.home,
        home_short: item.home,
        home_logo: "",
        home_score: homeScore,
        away_name: item.away,
        away_short: item.away,
        away_logo: "",
        away_score: awayScore,
        prediction_value: encodeLineWithResults(lineMeta.display || mergedLineText, lineMeta.results.opening, lineMeta.results.scores),
        prediction_result: mergedResult,
        odds: null,
        stake: totalStake,
        profit: totalProfit,
        summary: ""
    };

    try {
        const settleResponse = await fetch(
            `${SUPABASE_URL}/rest/v1/${SUPABASE_MATCHES_TABLE}?on_conflict=id`,
            {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_ANON_KEY,
                    "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                    "Content-Type": "application/json",
                    "Prefer": "resolution=merge-duplicates,return=minimal"
                },
                body: JSON.stringify([row])
            }
        );
        if (!settleResponse.ok) {
            const msg = await settleResponse.text();
            throw new Error(msg || "結算寫入失敗");
        }

        for (const entry of sameMatchItems) {
            const deleteResponse = await fetch(
                `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${encodeURIComponent(entry.id)}`,
                {
                    method: "DELETE",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                    }
                }
            );
            if (!deleteResponse.ok) {
                const msg = await deleteResponse.text();
                throw new Error(msg || "已寫入戰績，但刪除推薦失敗");
            }
        }

        alert(`已結算同場 ${sameMatchItems.length} 筆，合計獲利 ${totalProfit.toFixed(2)}`);
        await loadCloudRecommendations();
        await loadCloudSettledMatches();
    } catch (err) {
        console.error(err);
        alert("結算失敗，請檢查 matches/recommendations 權限設定");
    }
}

function renderWcGroupSwitch() {
    const container = document.getElementById("wcGroupSwitch");
    if (!container) return;
    container.innerHTML = WC_GROUPS.map((g) => {
        const activeClass = g === selectedWcGroup ? " active" : "";
        return `<button type="button" class="${activeClass.trim()}" onclick="setWcGroup('${g}')">${g}組</button>`;
    }).join("");
}

function wcFixtureFieldId(group, idx, field) {
    return `wc-${group}-${idx}-${field}`;
}

function formatWcDisplayDate(dateStr) {
    const parts = dateStr.split("-");
    if (parts.length !== 3) return dateStr;
    return `${parts[1]}/${parts[2]}`;
}

function renderWcFixturesList() {
    const container = document.getElementById("wcFixturesList");
    if (!container) return;

    const fixtures = WC_GROUP_FIXTURES[selectedWcGroup] || [];
    if (!fixtures.length) {
        container.innerHTML = `<div class="hint">此組別尚無賽程資料</div>`;
        return;
    }

    container.innerHTML = fixtures.map((fx, idx) => {
        const [home, away, date, time, round] = fx;
        const id = (field) => wcFixtureFieldId(selectedWcGroup, idx, field);
        return `
        <div class="wc-fixture-card">
            <div class="wc-fixture-head">
                <span class="wc-fixture-round">第${round}輪</span>
                <span class="wc-fixture-match">${home} vs ${away}</span>
                <span class="wc-fixture-time">${formatWcDisplayDate(date)} ${time}</span>
            </div>
            <div class="field-label">波膽（4 組）</div>
            <div class="wc-fixture-grid">
                <input id="${id("s1")}" type="text" placeholder="波膽 1">
                <input id="${id("s2")}" type="text" placeholder="波膽 2">
                <input id="${id("s3")}" type="text" placeholder="波膽 3">
                <input id="${id("s4")}" type="text" placeholder="波膽 4">
            </div>
            <div class="field-label">初盤</div>
            <input id="${id("line")}" type="text" placeholder="初盤，例如 大2.5">
            <button type="button" class="wc-fixture-submit" onclick="addWorldCupPredictionForFixture('${selectedWcGroup}', ${idx})">匯入此場</button>
        </div>`;
    }).join("");
}

function setWcGroup(group) {
    selectedWcGroup = group;
    renderWcGroupSwitch();
    renderWcFixturesList();
}

async function postWorldCupItem(item) {
    const supabaseReady =
        SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
        SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY";

    if (!supabaseReady) {
        recommendations.push({
            id: "wc_manual_" + Date.now(),
            ...item
        });
        saveRecommendations();
        return { ok: true, local: true };
    }

    let response = await fetch(
        `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`,
        {
            method: "POST",
            headers: {
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },
            body: JSON.stringify([item])
        }
    );

    if (!response.ok) {
        const openingLine = item.line;
        const scores = String(item.summary || "").split(" / ").filter(Boolean);
        const fallbackItem = {
            league: item.league,
            sport: item.sport,
            home: item.home,
            away: item.away,
            line: `初盤:${openingLine}｜波膽:${scores.join("/")}`,
            odds: null,
            stake: null,
            date: item.date,
            time: item.time,
            status: item.status
        };
        response = await fetch(
            `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`,
            {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_ANON_KEY,
                    "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                    "Content-Type": "application/json",
                    "Prefer": "return=minimal"
                },
                body: JSON.stringify([fallbackItem])
            }
        );
        if (!response.ok) {
            const msg = await response.text();
            throw new Error(msg || "Supabase 寫入失敗");
        }
    }

    return { ok: true, local: false };
}

async function addWorldCupPredictionForFixture(group, idx) {
    const fixtures = WC_GROUP_FIXTURES[group];
    if (!fixtures || !fixtures[idx]) return;

    const [home, away, date, time] = fixtures[idx];
    const field = (name) => document.getElementById(wcFixtureFieldId(group, idx, name));
    const openingLine = (field("line").value || "").trim();
    const scores = ["s1", "s2", "s3", "s4"]
        .map((key) => (field(key).value || "").trim())
        .filter(Boolean);

    if (!openingLine) {
        alert("請填寫初盤");
        return;
    }

    if (scores.length === 0) {
        alert("請至少填寫一組波膽");
        return;
    }

    const item = {
        league: `世足 ${group}組`,
        sport: "soccer",
        home,
        away,
        line: openingLine,
        summary: scores.join(" / "),
        odds: null,
        stake: null,
        date,
        time,
        status: "preview"
    };

    try {
        const result = await postWorldCupItem(item);
        alert(result.local ? "已儲存到本機（Supabase 未設定）" : `已匯入：${home} vs ${away}`);
        ["s1", "s2", "s3", "s4", "line"].forEach((key) => {
            field(key).value = "";
        });
        await loadCloudRecommendations();
    } catch (err) {
        console.error(err);
        recommendations.push({
            id: "wc_manual_" + Date.now(),
            ...item
        });
        saveRecommendations();
        alert("雲端寫入失敗，已改存本機備援。");
    }
}

async function addRecommendation() {
    const league = document.getElementById("league").value;
    const home = document.getElementById("home").value;
    const away = document.getElementById("away").value;
    const line = document.getElementById("line").value;
    const lineSide = document.getElementById("lineSide").value;
    const enableSecondBet = document.getElementById("enableSecondBet").checked;
    const line2 = document.getElementById("line2").value;
    const lineSide2 = document.getElementById("lineSide2").value;
    const dateTimeRaw = document.getElementById("matchDateTime").value;
    const parsedDateTime = parseDateTimeInput(dateTimeRaw);
    const odds = toNum(document.getElementById("odds").value);
    const stake = toNum(document.getElementById("stake").value);
    const odds2 = toNum(document.getElementById("odds2").value);
    const stake2 = toNum(document.getElementById("stake2").value);

    if (!parsedDateTime) {
        alert("請先填寫日期時間");
        return;
    }

    if (enableSecondBet && (odds2 === null || stake2 === null)) {
        alert("請完整填寫第二組賠率與投注金額");
        return;
    }

    const lineText = formatLineText(line, lineSide, currentSport);
    const lineText2 = formatLineText(line2, lineSide2, currentSport);

    const item = {
        league: formatLeagueName(league),
        sport: inferSportByLeague(league),
        home: home,
        away: away,
        line: lineText,
        odds: odds,
        stake: stake,
        date: parsedDateTime.date,
        time: parsedDateTime.time,
        status: "preview"
    };

    const itemsToInsert = [item];
    if (enableSecondBet) {
        itemsToInsert.push({
            ...item,
            line: lineText2,
            odds: odds2,
            stake: stake2
        });
    }

    const supabaseReady =
        SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
        SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY";

    if (!supabaseReady) {
        itemsToInsert.forEach((entry, idx) => {
            recommendations.push({
                id: "manual_" + Date.now() + "_" + idx,
                ...entry
            });
        });
        saveRecommendations();
        alert("尚未設定 Supabase，已先儲存到本機。設定完成後即可同步雲端。");
        return;
    }

    try {
        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`,
            {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_ANON_KEY,
                    "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                    "Content-Type": "application/json",
                    "Prefer": "return=minimal"
                },
                body: JSON.stringify(itemsToInsert)
            }
        );

        if (!response.ok) {
            const msg = await response.text();
            throw new Error(msg || "Supabase 寫入失敗");
        }

        alert("已成功匯入到雲端推薦資料");
        await loadCloudRecommendations();
    } catch (err) {
        console.error(err);
        recommendations.push({
            id: "manual_" + Date.now(),
            ...item
        });
        saveRecommendations();
        alert("雲端寫入失敗，已改存本機備援。請檢查 Supabase 設定。");
    }
}

async function settleMatchToCloud() {
    const league = document.getElementById("league").value;
    const home = document.getElementById("home").value;
    const away = document.getElementById("away").value;
    const line = document.getElementById("line").value;
    const lineSide = document.getElementById("lineSide").value;
    const dateTimeRaw = document.getElementById("matchDateTime").value;
    const parsedDateTime = parseDateTimeInput(dateTimeRaw);

    const odds = toNum(document.getElementById("odds").value);
    const stake = toNum(document.getElementById("stake").value);
    const homeScore = toNum(document.getElementById("homeScore").value);
    const awayScore = toNum(document.getElementById("awayScore").value);

    if (homeScore === null || awayScore === null) {
        alert("還沒輸入賽果（主隊比分/客隊比分）");
        return;
    }

    if (!parsedDateTime) {
        alert("請先填寫日期時間");
        return;
    }

    const supabaseReady =
        SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
        SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY";
    if (!supabaseReady) {
        alert("尚未設定 Supabase，無法結算到雲端戰績");
        return;
    }

    const lineText = currentSport === "basketball"
        ? `${lineSide === "home" ? "主隊" : "客隊"} ${line}`
        : line;

    const row = {
        id: buildMatchId(league, parsedDateTime.date, parsedDateTime.time, home, away),
        date: parsedDateTime.date,
        time: parsedDateTime.time,
        league: formatLeagueName(league),
        sport: inferSportByLeague(league),

        home_name: home,
        home_short: home,
        home_logo: "",
        home_score: homeScore,
        away_name: away,
        away_short: away,
        away_logo: "",
        away_score: awayScore,
        prediction_value: lineText,
        prediction_result: getPredictionResultByLine(line, homeScore, awayScore, lineSide),
        odds: odds,
        stake: stake,
        profit: getProfitByResult(getPredictionResultByLine(line, homeScore, awayScore, lineSide), stake, odds),

}

// ---------- 渲染 ----------
function render() {

    const list = document.getElementById("list");
    const totalEl = document.getElementById("total");
    if (!list || !totalEl) return;
    list.innerHTML = "";

    let total = 0;

    bets.forEach((b, i) => {

        const profit = isNaN(b.profit) ? 0 : b.profit;
        total += profit;

        list.innerHTML += `
        <tr>
            <td>${b.league}</td>
            <td>${b.home} vs ${b.away}</td>
            <td>${b.line}</td>
            <td>${b.stake}</td>
            <td>${b.homeScore}:${b.awayScore}</td>
            <td>${profit.toFixed(2)}</td>
            <td><button class="delBtn" onclick="del(${i})">X</button></td>
        </tr>`;
    });

    totalEl.innerText = "總盈虧：" + total.toFixed(2);
}

function addBet() {

    const league = document.getElementById("league").value;
    const home = document.getElementById("home").value;
    const away = document.getElementById("away").value;
    const line = document.getElementById("line").value;

    const odds = toNum(document.getElementById("odds").value);

        alert("請完整填寫所有欄位");

    }

    const profit = calc(line, odds, stake, homeScore, awayScore);

    bets.push({
        league,
        home,
        away,
        line,
        odds,
        stake,
        homeScore,
        awayScore,

    });

    render();
}

function del(i) {
    bets.splice(i, 1);
    save();
    render();
}
